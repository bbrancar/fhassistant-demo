<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FHAssistant — Sign in</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath fill='%231e4d6b' d='M12 3l9 8h-3v9h-4v-6h-4v6H6v-9H3z'/%3E%3C/svg%3E">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<main class="login-wrap">
  <div class="login-card">
    <div class="brand">
      <div class="logo" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 11l9-8 9 8"/>
          <path d="M5 10v10h14V10"/>
          <path d="M10 20v-6h4v6"/>
        </svg>
      </div>
      <h1>FHAssistant</h1>
      <p class="tagline">For fair housing advocates, by fair housing advocates</p>
    </div>
    <form id="login-form" novalidate autocomplete="off">
      <p class="login-error hidden" id="login-error">Invalid email or password.</p>
      <label>Email address
        <input type="text" name="email" placeholder="you@agency.gov">
      </label>
      <label>Password
        <input type="password" name="password" placeholder="••••••••">
      </label>
      <button class="primary" type="submit">Sign in</button>
    </form>
    <p class="aux">
      <a href="#" onclick="return false">Forgot password?</a> &middot;
      <a href="#" onclick="return false">Request an account</a>
    </p>
  </div>
  <p class="foot">Demonstration environment — do not enter real credentials or case information.</p>
</main>
<script>
  // Demo build: the check below is a stage prop, enforced only in this page's
  // JavaScript. Nothing is stored or transmitted.
  var DEMO_EMAIL = "demo@fhassistant.org";
  var DEMO_PASSWORD = "FHAdemo2026";

  document.getElementById('login-form').addEventListener('submit', function (e) {
    e.preventDefault();
    var email = this.email.value.trim().toLowerCase();
    var password = this.password.value;
    if (email === DEMO_EMAIL && password === DEMO_PASSWORD) {
      window.location.href = 'home.html';
    } else {
      document.getElementById('login-error').classList.remove('hidden');
    }
  });
</script>
</body>
</html>
